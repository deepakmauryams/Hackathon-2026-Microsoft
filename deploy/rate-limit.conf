# Empty keys are not counted. Shared memory coordinates all Nginx workers.
map $uri $hackathon_search_client {
    default "";
    /search $binary_remote_addr;
    /search/ $binary_remote_addr;
}
limit_req_zone $hackathon_search_client zone=hackathon_search:10m rate=5r/s;

# Refuse authenticated search over cleartext HTTP; health/docs stay accessible.
map "$scheme:$uri" $hackathon_insecure_search {
    default 0;
    "http:/search" 1;
    "http:/search/" 1;
}